<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight prices: Santiago to Alberta</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --good: #15803d; --good-bg: #dcfce7; --mid: #92400e; --mid-bg: #fef3c7;
    --high: #b91c1c; --high-bg: #fee2e2; --info-bg: #e0e7ff; --info: #3730a3;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b22; --text: #eef0f4; --muted: #98a2b3; --line: #2a2f3a;
      --accent: #6ea0ff; --good: #86efac; --good-bg: #14532d; --mid: #fcd34d; --mid-bg: #5b3a0a;
      --high: #fca5a5; --high-bg: #5f1d1d; --info-bg: #26307a; --info: #c7d2fe;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 14px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 999px; font-size: .9rem; white-space: nowrap; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .price { font-size: 2.4rem; font-weight: 700; letter-spacing: -.02em; }
  .cur { font-size: 1rem; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; margin-top: 6px; }
  .b-good { background: var(--good-bg); color: var(--good); }
  .b-mid { background: var(--mid-bg); color: var(--mid); }
  .b-high { background: var(--high-bg); color: var(--high); }
  .b-info { background: var(--info-bg); color: var(--info); }
  .meta { color: var(--muted); font-size: .88rem; margin-top: 8px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .stat .l { font-size: .75rem; color: var(--muted); }
  .stat .v { font-size: 1.05rem; font-weight: 600; margin-top: 2px; }
  .up { color: var(--high); } .down { color: var(--good); }
  .chartbox { position: relative; height: 260px; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: .78rem; }
  a { color: var(--accent); }
  .btn { display: inline-block; margin-top: 12px; padding: 10px 14px; background: var(--accent); color: #fff;
    border-radius: 10px; text-decoration: none; font-weight: 600; font-size: .9rem; }
  .note { color: var(--muted); font-size: .78rem; line-height: 1.5; }
  .empty { text-align: center; padding: 40px 10px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>✈️ Santiago → Alberta</h1>
  <div class="sub" id="updated">Loading…</div>
  <div class="chips" id="chips"></div>
  <div id="content"></div>
  <p class="note" id="foot"></p>
</main>

<script>
(function () {
  var data = null, routes = [], current = null, chart = null;
  var fmtMoney = function (n, cur) { return Math.round(n).toLocaleString("en-US") + (cur ? " " + cur : ""); };
  var fmtDate = function (iso) {
    return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  };
  var fmtDay = function (s) {
    return new Date(s + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  };

  function keyOf(o) { return o.dest + "|" + o.depart + "|" + (o.ret || ""); }

  function percentileRank(sorted, v) {
    var below = 0;
    for (var i = 0; i < sorted.length; i++) if (sorted[i] < v) below++;
    return below / sorted.length;
  }

  function load() {
    fetch("data.json?t=" + Date.now())
      .then(function (r) { if (!r.ok) throw new Error("no data"); return r.json(); })
      .then(function (d) { data = d; init(); })
      .catch(function () {
        document.getElementById("updated").textContent = "No data yet";
        document.getElementById("content").innerHTML =
          '<div class="card empty">No prices have been recorded yet.<br>Run the tracker once from the GitHub "Actions" tab and refresh this page in a minute.</div>';
      });
  }

  function init() {
    var seen = {};
    data.observations.forEach(function (o) {
      var k = keyOf(o);
      if (!seen[k]) { seen[k] = true; routes.push({ key: k, dest: o.dest, depart: o.depart, ret: o.ret }); }
    });
    var d = new Date(data.updated);
    document.getElementById("updated").textContent =
      "Last check: " + d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    var names = { YYC: "Calgary", YEG: "Edmonton" };
    var chips = document.getElementById("chips");
    chips.innerHTML = "";
    routes.forEach(function (r, i) {
      var b = document.createElement("button");
      b.className = "chip" + (i === 0 ? " on" : "");
      b.textContent = (names[r.dest] || r.dest) + " · " + fmtDate(r.depart + "T12:00:00") + (r.ret ? " – " + fmtDate(r.ret + "T12:00:00") : "");
      b.onclick = function () {
        Array.prototype.forEach.call(chips.children, function (c) { c.classList.remove("on"); });
        b.classList.add("on");
        show(r);
      };
      chips.appendChild(b);
    });
    var bags = data.checked_bags || 0;
    document.getElementById("foot").textContent =
      "Source: Google Flights (via SerpApi). Direct and 1-stop only. " +
      (bags ? "Prices include an ESTIMATED fee for " + bags + " checked bag(s); confirm the real bag rules on the airline site before buying." : "Prices do not include checked bags.");
    show(routes[0]);
  }

  function show(r) {
    current = r;
    var obs = data.observations.filter(function (o) { return keyOf(o) === r.key; })
      .sort(function (a, b) { return a.ts < b.ts ? -1 : 1; });
    var cur = data.currency;
    var last = obs[obs.length - 1];
    var prices = obs.map(function (o) { return o.price; });
    var sorted = prices.slice().sort(function (a, b) { return a - b; });
    var min = sorted[0], max = sorted[sorted.length - 1];
    var avg = prices.reduce(function (a, b) { return a + b; }, 0) / prices.length;
    var minHist = data.min_history || 7;

    var badge;
    if (obs.length >= minHist) {
      var rank = percentileRank(sorted, last.price);
      if (rank <= 0.2) badge = '<span class="badge b-good">Good price: cheaper than ' + Math.round((1 - rank) * 100) + '% of past prices</span>';
      else if (rank <= 0.6) badge = '<span class="badge b-mid">Typical price</span>';
      else badge = '<span class="badge b-high">Expensive right now</span>';
    } else {
      var g = last.level === "low" ? '<span class="badge b-good">Google says: low price</span>'
            : last.level === "high" ? '<span class="badge b-high">Google says: high price</span>'
            : last.level === "typical" ? '<span class="badge b-mid">Google says: typical price</span>' : "";
      badge = g + ' <span class="badge b-info">Building history (' + obs.length + '/' + minHist + ' checks)</span>';
    }

    function changeSince(days) {
      var cutoff = new Date(last.ts).getTime() - days * 86400000;
      var ref = null;
      for (var i = 0; i < obs.length; i++) { if (new Date(obs[i].ts).getTime() <= cutoff) ref = obs[i]; }
      if (!ref) return '<span class="v">–</span>';
      var diff = last.price - ref.price, pct = diff / ref.price * 100;
      var cls = diff > 0 ? "up" : diff < 0 ? "down" : "";
      return '<span class="v ' + cls + '">' + (diff > 0 ? "+" : "") + Math.round(diff).toLocaleString("en-US") + " (" + (diff > 0 ? "+" : "") + pct.toFixed(1) + "%)</span>";
    }

    var kind = last.stops === 0 ? "Direct" : "1 stop" + (last.via ? " via " + last.via : "");
    var mins = last.duration_min;
    var dur = mins ? Math.floor(mins / 60) + "h " + (mins % 60) + "m" : "";
    var bagLine = last.bag_fee ? " (fare " + fmtMoney(last.base_price) + " + est. bags " + fmtMoney(last.bag_fee) + ")" : "";

    var html = '<div class="card">' +
      '<div class="price">' + fmtMoney(last.price) + '<span class="cur">' + cur + '</span></div>' + badge +
      '<div class="meta">' + kind + " · " + last.airlines + (dur ? " · " + dur : "") + bagLine + '<br>' +
      'Depart ' + fmtDay(r.depart) + (r.ret ? ", return " + fmtDay(r.ret) : " (one-way)") + '</div>' +
      (last.link ? '<a class="btn" href="' + last.link + '" target="_blank" rel="noopener">Open in Google Flights</a>' : "") +
      '<div class="grid">' +
      '<div class="stat"><div class="l">Lowest seen</div><div class="v">' + fmtMoney(min) + '</div></div>' +
      '<div class="stat"><div class="l">Average</div><div class="v">' + fmtMoney(avg) + '</div></div>' +
      '<div class="stat"><div class="l">Highest seen</div><div class="v">' + fmtMoney(max) + '</div></div>' +
      '<div class="stat"><div class="l">Change vs 7 days ago</div>' + changeSince(7) + '</div>' +
      '</div></div>' +
      '<div class="card"><div class="chartbox"><canvas id="chart"></canvas></div></div>' +
      '<div class="card"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Price</th><th>Stops</th><th>Airline</th></tr></thead><tbody>' +
      obs.slice(-14).reverse().map(function (o) {
        return "<tr><td>" + fmtDate(o.ts) + "</td><td>" + fmtMoney(o.price) + "</td><td>" +
          (o.stops === 0 ? "Direct" : "1 · " + (o.via || "")) + "</td><td>" + o.airlines + "</td></tr>";
      }).join("") + "</tbody></table></div></div>";
    document.getElementById("content").innerHTML = html;
    drawChart(obs);
  }

  function drawChart(obs) {
    if (chart) { chart.destroy(); chart = null; }
    if (typeof Chart === "undefined") return;
    var css = getComputedStyle(document.documentElement);
    var accent = css.getPropertyValue("--accent").trim();
    var muted = css.getPropertyValue("--muted").trim();
    var line = css.getPropertyValue("--line").trim();
    var hasBags = obs.some(function (o) { return o.bag_fee > 0; });
    var datasets = [{
      label: hasBags ? "Total with bags" : "Price",
      data: obs.map(function (o) { return o.price; }),
      borderColor: accent, backgroundColor: accent, tension: .25, pointRadius: obs.length > 40 ? 0 : 3, borderWidth: 2
    }];
    if (hasBags) datasets.push({
      label: "Fare only", data: obs.map(function (o) { return o.base_price; }),
      borderColor: muted, backgroundColor: muted, borderDash: [5, 4], tension: .25, pointRadius: 0, borderWidth: 1.5
    });
    chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: { labels: obs.map(function (o) { return fmtDate(o.ts); }), datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: muted } } },
        scales: {
          x: { ticks: { color: muted, maxTicksLimit: 7 }, grid: { color: line } },
          y: { ticks: { color: muted }, grid: { color: line } }
        }
      }
    });
  }

  load();
})();
</script>
</body>
</html>
