name: Check flight prices

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC (about 9am in Chile)
  workflow_dispatch:        # lets you press a "Run workflow" button any time

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check prices
        run: python tracker.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save results
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Update prices" || echo "Nothing to commit"
          git push
